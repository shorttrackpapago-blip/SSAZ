<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 337">
  <!-- Spokey, on mushrooms: a whole person now, but the head is still the wrench -->
  <g stroke="#111" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">
    <!-- legs + sneakers -->
    <path d="M84 228 L76 316 L102 316 L110 236 Z" fill="#2E5FA8"/>
    <path d="M112 236 L122 316 L148 316 L140 228 Z" fill="#2E5FA8"/>
    <path d="M70 316 h36 q6 0 6 8 v6 h-46 q-4 -14 4 -14 Z" fill="#fff"/>
    <path d="M118 316 h36 q8 0 8 14 h-46 v-6 q0 -8 2 -8 Z" fill="#fff"/>
    <path d="M70 326 h40 M118 326 h40" stroke="#CC1218" stroke-width="5"/>
    <!-- arms (left waves a peace sign, right holds a beer) -->
    <path d="M66 156 Q34 140 30 100" fill="none" stroke="#111" stroke-width="20"/>
    <path d="M66 156 Q34 140 30 100" fill="none" stroke="#E8B48A" stroke-width="13"/>
    <path d="M24 100 l-6 -24 M34 98 l4 -24" stroke="#111" stroke-width="9"/>
    <path d="M24 100 l-6 -24 M34 98 l4 -24" stroke="#E8B48A" stroke-width="5"/>
    <circle cx="30" cy="102" r="10" fill="#E8B48A"/>
    <path d="M156 156 Q186 176 182 214" fill="none" stroke="#111" stroke-width="20"/>
    <path d="M156 156 Q186 176 182 214" fill="none" stroke="#E8B48A" stroke-width="13"/>
    <rect x="168" y="200" width="28" height="44" rx="5" fill="#C9D3DA"/>
    <rect x="168" y="212" width="28" height="18" fill="#0161C9"/>
    <circle cx="182" cy="214" r="9" fill="#E8B48A"/>
    <!-- tie-dye shirt -->
    <path d="M60 150 Q110 128 162 150 L150 238 Q110 248 72 238 Z" fill="#CC1218"/>
    <path d="M78 170 q16 -12 30 4 q14 16 34 0 M74 200 q20 14 38 -2 q18 -16 36 4" fill="none" stroke="#FFDE06" stroke-width="5"/>
    <path d="M92 220 q18 8 36 0" fill="none" stroke="#FC8200" stroke-width="5"/>
    <!-- neck -->
    <rect x="98" y="122" width="24" height="22" fill="#E8B48A"/>
    <!-- the wrench head, with its notches -->
    <g fill="#D9232D">
      <rect x="58" y="70" width="14" height="22"/><rect x="148" y="70" width="14" height="22"/>
      <rect x="99" y="18" width="22" height="14"/>
    </g>
    <circle cx="110" cy="80" r="50" fill="#D9232D"/>
    <!-- headband -->
    <path d="M64 58 Q110 30 156 58" fill="none" stroke="#FFDE06" stroke-width="10"/>
    <path d="M64 58 Q110 30 156 58" fill="none" stroke="#A55BD4" stroke-width="4" stroke-dasharray="8 6"/>
    <!-- googly eyes -->
    <circle cx="90" cy="76" r="16" fill="#fff"/><circle cx="131" cy="76" r="16" fill="#fff"/>
    <circle cx="95" cy="82" r="7" fill="#111" stroke="none"/><circle cx="125" cy="70" r="7" fill="#111" stroke="none"/>
    <!-- mustache + grin -->
    <path d="M84 104 q13 -10 26 0 q13 -10 26 0 q-12 10 -26 4 q-14 6 -26 -4 Z" fill="#5A3A1E"/>
    <path d="M94 116 q16 12 32 0" fill="none" stroke-width="4"/>
  </g>
</svg>
